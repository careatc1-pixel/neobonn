<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#efe9db"/>
  <circle cx="200" cy="200" r="150" fill="#f6f3ec"/>

  <!-- oil bottle -->
  <g>
    <!-- bottle body (rounder, taller) -->
    <path d="M160 190 Q160 170 180 170 L220 170 Q240 170 240 190 L240 300 Q240 320 220 320 L180 320 Q160 320 160 300 Z" fill="#22362a"/>
    <!-- label -->
    <rect x="170" y="220" width="60" height="60" rx="4" fill="#f6f3ec" opacity="0.95"/>
    <text x="200" y="240" font-family="Georgia, serif" font-size="10" fill="#33503f" text-anchor="middle">neobonn</text>
    <text x="200" y="255" font-family="Arial, sans-serif" font-size="6" fill="#c79a3d" letter-spacing="0.5" text-anchor="middle">ONION &amp; BIOTIN</text>
    <text x="200" y="264" font-family="Arial, sans-serif" font-size="6" fill="#c79a3d" letter-spacing="0.5" text-anchor="middle">HAIR OIL</text>

    <!-- neck -->
    <rect x="185" y="145" width="30" height="28" fill="#33503f"/>
    <!-- cap -->
    <rect x="178" y="120" width="44" height="28" rx="5" fill="#c79a3d"/>
  </g>

  <!-- onion + curry leaf motif -->
  <g opacity="0.4">
    <circle cx="110" cy="290" r="18" fill="#c79a3d"/>
    <path d="M110 272 Q104 260 110 250 Q116 260 110 272 Z" fill="#33503f"/>
    <ellipse cx="290" cy="285" rx="20" ry="10" fill="#33503f" transform="rotate(-20 290 285)"/>
    <ellipse cx="300" cy="270" rx="16" ry="8" fill="#33503f" transform="rotate(10 300 270)"/>
  </g>
</svg>
