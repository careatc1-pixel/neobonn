    <text x="200" y="235" font-family="Georgia, serif" font-size="10" fill="#33503f" text-anchor="middle">neobonn</text>
    <text x="200" y="250" font-family="Arial, sans-serif" font-size="6" fill="#c79a3d" letter-spacing="0.5" text-anchor="middle">HERBAL</text>
