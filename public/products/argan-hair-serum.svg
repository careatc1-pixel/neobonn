<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#efe9db"/>
  <circle cx="200" cy="200" r="150" fill="#f6f3ec"/>

  <!-- dropper bottle -->
  <g>
    <!-- bottle body -->
    <rect x="150" y="180" width="100" height="140" rx="14" fill="#33503f"/>
    <rect x="150" y="180" width="100" height="140" rx="14" fill="none" stroke="#22362a" stroke-width="2"/>
    <!-- liquid highlight -->
    <rect x="160" y="230" width="80" height="80" rx="8" fill="#c79a3d" opacity="0.25"/>
    <!-- label -->
    <rect x="165" y="235" width="70" height="50" rx="4" fill="#f6f3ec" opacity="0.92"/>
    <text x="200" y="255" font-family="Georgia, serif" font-size="11" fill="#33503f" text-anchor="middle">neobonn</text>
    <text x="200" y="270" font-family="Arial, sans-serif" font-size="6.5" fill="#c79a3d" letter-spacing="1" text-anchor="middle">ARGAN HAIR</text>
    <text x="200" y="279" font-family="Arial, sans-serif" font-size="6.5" fill="#c79a3d" letter-spacing="1" text-anchor="middle">SERUM</text>

    <!-- neck -->
    <rect x="182" y="150" width="36" height="32" fill="#22362a"/>
    <!-- dropper cap -->
    <rect x="176" y="120" width="48" height="34" rx="6" fill="#c79a3d"/>
    <!-- dropper stem -->
    <rect x="196" y="90" width="8" height="34" fill="#e0bd6e"/>
    <ellipse cx="200" cy="90" rx="10" ry="6" fill="#e0bd6e"/>
  </g>

  <!-- decorative leaves -->
  <g fill="#33503f" opacity="0.35">
    <ellipse cx="120" cy="300" rx="22" ry="9" transform="rotate(-30 120 300)"/>
    <ellipse cx="285" cy="290" rx="22" ry="9" transform="rotate(25 285 290)"/>
  </g>
</svg>
