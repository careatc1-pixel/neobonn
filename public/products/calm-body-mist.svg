<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#efe9db"/>
  <circle cx="200" cy="200" r="150" fill="#f6f3ec"/>

  <!-- mist puffs -->
  <g fill="#c79a3d" opacity="0.25">
    <circle cx="255" cy="120" r="10"/>
    <circle cx="272" cy="132" r="7"/>
    <circle cx="240" cy="110" r="6"/>
  </g>

  <!-- spray bottle -->
  <g>
    <!-- body -->
    <rect x="165" y="190" width="70" height="130" rx="12" fill="#33503f"/>
    <!-- label -->
    <rect x="173" y="230" width="54" height="46" rx="4" fill="#f6f3ec" opacity="0.95"/>
    <text x="200" y="248" font-family="Georgia, serif" font-size="9" fill="#33503f" text-anchor="middle">neobonn</text>
    <text x="200" y="261" font-family="Arial, sans-serif" font-size="5.5" fill="#c79a3d" letter-spacing="0.5" text-anchor="middle">CALM BODY</text>
    <text x="200" y="269" font-family="Arial, sans-serif" font-size="5.5" fill="#c79a3d" letter-spacing="0.5" text-anchor="middle">MIST</text>

    <!-- shoulder/neck -->
    <rect x="185" y="165" width="30" height="28" fill="#22362a"/>
    <!-- spray trigger head -->
    <rect x="178" y="145" width="44" height="22" rx="6" fill="#c79a3d"/>
    <rect x="222" y="140" width="30" height="10" rx="4" fill="#e0bd6e" transform="rotate(10 222 140)"/>
    <rect x="192" y="128" width="8" height="20" fill="#e0bd6e"/>
  </g>

  <!-- lavender sprigs -->
  <g opacity="0.35">
    <g transform="translate(120,290)">
      <line x1="0" y1="0" x2="0" y2="-40" stroke="#33503f" stroke-width="3"/>
      <circle cx="-4" cy="-10" r="4" fill="#33503f"/>
      <circle cx="4" cy="-16" r="4" fill="#33503f"/>
      <circle cx="-3" cy="-22" r="4" fill="#33503f"/>
      <circle cx="3" cy="-28" r="4" fill="#33503f"/>
      <circle cx="0" cy="-35" r="4" fill="#33503f"/>
    </g>
    <g transform="translate(285,300)">
      <line x1="0" y1="0" x2="0" y2="-36" stroke="#33503f" stroke-width="3"/>
      <circle cx="-3" cy="-9" r="3.5" fill="#33503f"/>
      <circle cx="3" cy="-15" r="3.5" fill="#33503f"/>
      <circle cx="-2" cy="-21" r="3.5" fill="#33503f"/>
      <circle cx="2" cy="-27" r="3.5" fill="#33503f"/>
    </g>
  </g>
</svg>
